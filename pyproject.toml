[project]
name = "blender-mcp-container"
version = "0.1.0"
description = "Container packaging for the official Blender Lab MCP server"
requires-python = ">=3.14,<3.15"
dependencies = ["blender-mcp"]

[dependency-groups]
dev = ["ruff>=0.16.8"]

[tool.uv]
package = false
required-version = ">=0.12.17"
build-constraint-dependencies = ["setuptools==84.0.0"]

[tool.uv.sources]
blender-mcp = { git = "https://projects.blender.org/lab/blender_mcp.git", rev = "2cea8d566dde07fbac28a61d698909d69724e853", subdirectory = "mcp" }

[tool.ruff]
required-version = ">=0.16.8"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103", "INP001", "S101", "S603", "S607", "T201"]
